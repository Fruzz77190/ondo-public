<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ondo · Réglages du son</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<style>
/* Réglages › Son (Julien, 19 nov.) : prototype de la partie « Son » des Réglages de l'app, avec les couleurs et les cartes de
   l'écran Réglages (reglages.tsx, SettingRow.tsx). Les volumes sont gardés sur le téléphone et lus par les 7 lieux du test. */
:root{--bg:#fcf1e6;--card:#fff9f3;--sunk:#f5e2d2;--line:#e6cdb9;--lineSoft:#f0dfd0;--page:#f3e6da;--ink:#3b2c1f;--muted:#75594a;--primary:#b4483a;
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.stage{position:relative;width:100%;max-width:430px;min-height:100%;background:var(--bg);padding:calc(env(safe-area-inset-top) + 18px) 18px 40px}
@media (min-width:520px){.stage{min-height:auto;height:min(100%,880px);border-radius:44px;box-shadow:0 24px 60px rgba(59,44,31,.22);overflow:auto}}
.barre{display:flex;align-items:center;gap:12px;padding:6px 2px 8px}
.retour{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 10px rgba(59,44,31,.12);cursor:pointer}
h1{margin:0;font:800 22px/28px var(--font)}
.sct{font:800 12px/1.2 var(--font);letter-spacing:.96px;text-transform:uppercase;color:var(--muted);margin:18px 6px 8px}
.liste{background:var(--card);border-radius:22px;box-shadow:0 6px 10px rgba(59,44,31,.08);padding:4px 16px}
.ligne{padding:14px 0}
.ligne+.ligne{border-top:1px solid var(--lineSoft)}
.tete{display:flex;align-items:center;gap:10px}
.nom{flex:1;font:800 16px/20px var(--font)}
.sous{font:600 13px/18px var(--font);color:var(--muted);margin-top:2px}
.val{font:800 15px/20px var(--font);color:var(--primary);min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.test{width:36px;height:36px;border-radius:12px;border:0;background:var(--sunk);display:grid;place-items:center;cursor:pointer;flex:none}
.test[aria-pressed="true"]{background:var(--primary)}
.test[aria-pressed="true"] svg{stroke:#fff9f3}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:8px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--primary) var(--p,66%),var(--line) var(--p,66%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--primary)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--card);border:3px solid var(--primary);margin-top:-9px;box-shadow:0 2px 6px rgba(59,44,31,.2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--primary)}
.bornes{display:flex;justify-content:space-between;font:700 11px/1 var(--font);color:var(--muted)}
.raz{display:block;margin:18px auto 0;border:0;background:none;font:700 14px/1.2 var(--font);color:var(--primary);cursor:pointer;text-decoration:underline}
.note{font:600 13px/19px var(--font);color:var(--muted);text-align:center;margin:16px 10px 0}
</style>
</head>
<body>
<div class="stage">
  <div class="barre">
    <button class="retour" id="retour" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b2c1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1>Réglages</h1>
  </div>

  <p class="sct">Son</p>
  <div class="liste" id="liste"></div>
  <button class="raz" id="raz">Remettre les volumes d'origine</button>
  <p class="note">Les volumes s'appliquent à toutes tes séances. 100 % correspond au mélange d'origine.</p>
</div>
<script>
const CLE='ondo-proto-volumes',SONS='sons-lavande-0025912d/';
// les trois réglages, et le petit extrait joué par le bouton ▶ (même niveau que dans la séance du champ de lavande)
const REGLAGES=[
  {id:'musique',nom:'Musiques',sous:'La musique de chaque lieu',fichier:'musique.m4a',niv:1.15*.239,depart:20},
  {id:'sons',nom:'Sons',sous:'Le vent, la nature, les carillons…',fichier:'cigales.m4a',niv:.75*.157,depart:10},
  {id:'gong',nom:'Gong',sous:'Le gong qui guide le souffle',fichier:'gong-la.m4a',niv:.75*.906,depart:0}];
const lire=()=>{try{return JSON.parse(localStorage.getItem(CLE)||'{}')}catch(e){return{}}};
const ecrire=v=>{try{localStorage.setItem(CLE,JSON.stringify(v))}catch(e){}};
const muet=()=>{try{return localStorage.getItem('ondo-proto-muet')==='1'}catch(e){return false}};
let V=Object.assign({musique:1,sons:1,gong:1},lire());
const liste=document.getElementById('liste');
REGLAGES.forEach(r=>{const d=document.createElement('div');d.className='ligne';
  d.innerHTML=`<div class="tete"><div style="flex:1"><div class="nom">${r.nom}</div><div class="sous">${r.sous}</div></div>
    <span class="val" id="v-${r.id}"></span>
    <button class="test" id="t-${r.id}" aria-label="Écouter ${r.nom.toLowerCase()}" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b4483a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8V4z"/></svg></button></div>
    <input type="range" min="0" max="150" step="5" id="r-${r.id}" aria-label="Volume ${r.nom.toLowerCase()}">
    <div class="bornes"><span>0 %</span><span>100 %</span><span>150 %</span></div>`;
  liste.appendChild(d)});
function afficher(){REGLAGES.forEach(r=>{const x=Math.round(V[r.id]*100),inp=document.getElementById('r-'+r.id);inp.value=x;inp.style.setProperty('--p',(x/150*100).toFixed(1)+'%');
  document.getElementById('v-'+r.id).textContent=x+' %'})}
afficher();
REGLAGES.forEach(r=>{document.getElementById('r-'+r.id).addEventListener('input',e=>{V[r.id]=Math.round(+e.target.value)/100;ecrire(V);afficher();if(ext&&ext.id===r.id)ext.g.gain.setTargetAtTime(r.niv*V[r.id],ctx.currentTime,.05)})});
document.getElementById('raz').addEventListener('click',()=>{V={musique:1,sons:1,gong:1};ecrire(V);afficher();if(ext)ext.g.gain.setTargetAtTime(REGLAGES.find(r=>r.id===ext.id).niv,ctx.currentTime,.05)});
document.getElementById('retour').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='lavande-0025912d.html'});
// ▶ : un extrait de 6 s, au volume choisi (on peut bouger le curseur pendant l'écoute)
let ctx=null,ext=null;const tampons={};
async function ecouter(r){const b=document.getElementById('t-'+r.id);
  if(ext){const fin=ext;fin.s.stop();document.getElementById('t-'+fin.id).setAttribute('aria-pressed','false');ext=null;if(fin.id===r.id)return}
  if(muet())return;
  try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
    if(!tampons[r.id]){const a=await (await fetch(SONS+r.fichier)).arrayBuffer();tampons[r.id]=await new Promise((ok,ko)=>ctx.decodeAudioData(a,ok,ko))}
    const s=ctx.createBufferSource();s.buffer=tampons[r.id];const g=ctx.createGain(),t=ctx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(r.niv*V[r.id],t+.3);
    g.gain.setValueAtTime(r.niv*V[r.id],t+5.2);g.gain.linearRampToValueAtTime(0,t+6);s.connect(g).connect(ctx.destination);s.start(t,r.depart,6.2);
    ext={id:r.id,s,g};b.setAttribute('aria-pressed','true');s.onended=()=>{if(ext&&ext.s===s){ext=null;b.setAttribute('aria-pressed','false')}}}
  catch(e){b.setAttribute('aria-pressed','false')}}
REGLAGES.forEach(r=>document.getElementById('t-'+r.id).addEventListener('click',()=>ecouter(r)));
</script>
</body>
</html>
